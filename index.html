<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#6750A4">
<title>Text Fairy Voice</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f3fa;color:#202124}
header{background:#6750A4;color:#fff;padding:18px;text-align:center;font-size:24px;font-weight:700}
main{max-width:700px;margin:auto;padding:16px}.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 3px 12px #0001}
button{border:0;border-radius:14px;padding:14px 12px;font-size:16px;font-weight:700;cursor:pointer;margin:4px}
.primary{background:#6750A4;color:white;width:100%}.voices{display:flex;gap:6px}.voices button{flex:1;background:#eee}
textarea{width:100%;min-height:230px;border:1px solid #ccc;border-radius:14px;padding:14px;font-size:18px;line-height:1.7;resize:vertical}
#preview{width:100%;max-height:280px;object-fit:contain;border-radius:12px;display:none;background:#eee}
label{display:block;margin:10px 0 5px;font-weight:700}.status{text-align:center;padding:8px;color:#555}
.small{font-size:13px;color:#666;line-height:1.5}
</style>
</head>
<body>
<header>📖 Text Fairy Voice</header>
<main>
<div class="card">
  <button class="primary" id="pick">📷 اختيار صورة</button>
  <input id="file" type="file" accept="image/*" capture="environment" hidden>
  <img id="preview">
  <div id="status" class="status">اختر صورة لاستخراج النص</div>
</div>

<div class="card">
  <label>النص</label>
  <textarea id="text" placeholder="النص المستخرج سيظهر هنا..."></textarea>
  <div class="voices">
    <button id="us">🇺🇸 American</button>
    <button id="uk">🇬🇧 British</button>
  </div>
  <label>سرعة النطق</label>
  <input id="rate" type="range" min=".5" max="1.5" step=".05" value="1" style="width:100%">
  <button id="copy" class="primary">📋 نسخ النص</button>
</div>

<div class="card small">
<b>ملاحظة:</b> النطق يستخدم محرك النطق الموجود في الجهاز. إذا لم يكن الصوت الأمريكي أو البريطاني مثبتًا، افتح إعدادات تحويل النص إلى كلام في الهاتف وثبّت الصوت المطلوب.
</div>
</main>

<script>
const $=id=>document.getElementById(id);
let selectedLang="en-US";
$("pick").onclick=()=>$("file").click();
$("file").onchange=async e=>{
 const f=e.target.files[0]; if(!f)return;
 $("preview").src=URL.createObjectURL(f); $("preview").style.display="block";
 $("status").textContent="جاري استخراج النص...";
 try{
   if(!window.Tesseract){throw new Error("OCR library unavailable")}
   const r=await Tesseract.recognize(f,"eng",{logger:m=>{
     if(m.status) $("status").textContent="OCR: "+m.status+" "+Math.round((m.progress||0)*100)+"%";
   }});
   $("text").value=r.data.text;
   $("status").textContent="تم استخراج النص";
 }catch(err){
   $("status").textContent="تعذر تشغيل OCR. استخدم نسخة التطبيق بعد تضمين محرك OCR محلي.";
 }
};
$("us").onclick=()=>speak("en-US");
$("uk").onclick=()=>speak("en-GB");
function speak(lang){
 selectedLang=lang; const t=$("text").value.trim();
 if(!t){$("status").textContent="اكتب أو استخرج نصًا أولًا";return}
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(t); u.lang=lang; u.rate=parseFloat($("rate").value);
 speechSynthesis.speak(u);
 $("status").textContent=lang==="en-US"?"النطق الأمريكي":"النطق البريطاني";
}
$("copy").onclick=async()=>{
 try{await navigator.clipboard.writeText($("text").value);$("status").textContent="تم نسخ النص"}
 catch{$("text").select();document.execCommand("copy");$("status").textContent="تم نسخ النص"}
};
</script>
<!-- Tesseract.js must be bundled locally for true offline OCR.
     The APK/Web version should replace this placeholder with a local copy. -->
<script src="tesseract.min.js"></script>
</body>
</html>
